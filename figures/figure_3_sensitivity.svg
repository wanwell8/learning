<text x="50.0" y="602.0" font-size="10.5" fill="#5b6770">One-at-a-time perturbations around the Summer-typical-day baseline, ranked by impact on the interval width. The peak-period tariff coefficient η dominates the</text>
<text x="50.0" y="616.0" font-size="10.5" fill="#5b6770">ranking and acts almost symmetrically. The two design dials (τ and η) produce responses of different magnitude, with η delivering the larger swing because it scales</text>
<text x="50.0" y="630.0" font-size="10.5" fill="#5b6770">the per-unit price deviation directly.</text>
