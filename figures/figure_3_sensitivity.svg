<text x="50.0" y="602.0" font-size="10.5" fill="#5b6770">Left: tornado of one-at-a-time perturbations around the Summer-typical-day baseline; the tariff fluctuation η dominates and acts almost symmetrically. Right:</text>
<text x="50.0" y="616.0" font-size="10.5" fill="#5b6770">aggregated swing per driver family, ordered by leverage on the response band. The two design dials (τ and η) produce responses of comparable order, with tariff η</text>
<text x="50.0" y="630.0" font-size="10.5" fill="#5b6770">delivering the larger swing because it scales the per-unit price deviation directly.</text>
