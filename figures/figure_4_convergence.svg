<text x="152.0" y="148.5" font-size="10.5" fill="#1f2933">Inter-quartile spread (8 seeds)</text>
<rect x="118.0" y="158.0" width="26.0" height="10" fill="#d1495b" fill-opacity="0.30" stroke="#d1495b" stroke-width="0.8"/>
<text x="152.0" y="166.5" font-size="10.5" fill="#1f2933">±9% reference band</text>
<text x="50.0" y="542.0" font-size="10.5" fill="#5b6770">The envelope width settles inside a ±11% band of the N=5000 reference once N reaches 2000, and inside ±20% once N reaches 500. The</text>
<text x="50.0" y="556.0" font-size="10.5" fill="#5b6770">N=2000 setting used elsewhere in the case study is therefore a reasonable compromise between fidelity and runtime. Because the</text>
<text x="50.0" y="570.0" font-size="10.5" fill="#5b6770">interval is decided by extreme samples, convergence is slower than for mean-statistics estimators.</text>
