<text x="50.0" y="542.0" font-size="10.5" fill="#5b6770">Left: the envelope width settles inside a ±9% band of the N=5000 reference once N ≈ 1000, justifying the N=2000 setting used elsewhere. Right: filter rejection profile by typical</text>
